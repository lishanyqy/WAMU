defaults:
  - model: dual_system
  - dataloader: robotwin          # replaced below by the wamu_real reader
  - _self_

# v3.0 WAMU real (WAMsU/wamu_real): plain joint self-attention (MoT), initialized
# from Wan2.2-TI2V-5B only (no robot pretraining). Same model recipe as
# train_robotwin_clean_self_attn.yaml. v3.1 / v3.2 inherit this file and only
# change the warm-start checkpoint (and v3.2 the attention mask).
model:
  architecture:
    variant: joint_self_attn
    attention_mask_mode: action_sees_video   # = OpenWAM/pretrain_robot_only
    video_attention_mask_mode: first_frame_causal
    action_film: false                       # official pretrained checkpoints have no FiLM
    detach_video: false
    bridge_noise:
      enabled: false

dataloader:
  type: wamu_real
  dataset_dir: ${oc.env:OPEN_WAM_WAMU_REAL_DATA,datasets/lishanyang_wamu_real}
  split: train
  action_mode: joint
  unify_action: true
  unify_action_map: ["0-6", "34-40"]        # left arm -> 0-6, right arm -> 34-40 (headphones: left arm only)
  num_frames: 33                            # 32-step action horizon
  video_stride: 4
  window_stride: 1
  height: 384
  width: 320
  normalize_mode: quantile                  # shared stats over all four tasks -> [-1, 1]
  normalization_stats_path: ${dataloader.dataset_dir}/meta/stats.json
  multiview: true
  camera_layout: [observation.images.top, observation.images.left_wrist, observation.images.right_wrist]
  target_camera: observation.images.top
  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.0

training:
  debug: false
  learning_rate: 1e-4
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

  # 166,098 windows; per-GPU 16 x 4 GPUs x accum 4 = 256 / step -> ~650 steps per epoch.
  num_epochs: null
  max_steps: 20000                # ~15 epochs over the 245 episodes
  batch_size: 16
  gradient_accumulation_steps: 4

  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null

  mixed_precision: bf16
  zero_stage: 2
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: false
  offload_optimizer_device: none

  lambda_video: 1.0
  lambda_action: 1.0
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0

  output_path: outputs/wamu_real_self_attn
  save_steps: 3000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 4

  finetune_ckpt_path: null
  resume_ckpt_path: null
  dataset_num_workers: 8

project:
  name: openwam-wamu-real
  wandb:
    enabled: false
    project: openwam-wamu-real
